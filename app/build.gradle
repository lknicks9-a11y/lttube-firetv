plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lttube.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lttube.tv'
        minSdk 22          // Fire OS 5 (oldest Fire TV sticks) and newer
        targetSdk 34
        // GitHub's build number is the version: build 12 = 1.0.12 (matches the release tag)
        def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode build
        versionName "1.0.${build}"
    }

    signingConfigs {
        // Fixed key so new versions install over old ones.
        release {
            storeFile file('lttube.keystore')
            storePassword 'lttubetv'
            keyAlias 'lttube'
            keyPassword 'lttubetv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all {
            testLogging { events 'passed', 'failed', 'standardOut', 'standardError'; showStandardStreams = true }
        }
    }
}

dependencies {
    // YouTube extraction (same library NewPipe uses)
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.27.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.2'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // TV interface
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Video player
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
