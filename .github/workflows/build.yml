name: Build Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease --no-daemon

      - name: Check YouTube extraction (does not block the build)
        continue-on-error: true
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:testReleaseUnitTest --tests com.lttube.tv.ExtractionTest --tests com.lttube.tv.TvFeedTest --no-daemon 2>&1 | grep -E "LTT|FAILED|Exception" | head -200 || true

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk LTTube-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LTTube-TV
          path: LTTube-TV.apk

      - name: Publish release (only when VERSION changed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION | tr -d '[:space:]')"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V already released; built only."
            exit 0
          fi
          NOTES="$(cat RELEASE_NOTES.md 2>/dev/null || git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session')"
          gh release create "v$V" LTTube-TV.apk --title "LTTube $V" --latest --notes "$NOTES"
