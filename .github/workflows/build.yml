name: Build Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease --no-daemon

      - name: Check YouTube extraction (does not block the build)
        continue-on-error: true
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:testReleaseUnitTest --tests com.lttube.tv.ExtractionTest --no-daemon -q 2>&1 | grep -E "LTT|FAIL|Exception" | head -60 || true

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk LTTube-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LTTube-TV
          path: LTTube-TV.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" LTTube-TV.apk \
            --title "LTTube TV 1.0.${{ github.run_number }}" \
            --latest \
            --notes "Fire TV: open Downloader and enter github.com/${{ github.repository }}/releases/latest/download/LTTube-TV.apk"
