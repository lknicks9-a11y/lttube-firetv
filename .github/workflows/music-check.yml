name: Check LT Music

on:
  push:
    branches: [music-dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build both apps
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleMusicRelease :app:assembleTubeRelease --no-daemon 2>&1 | grep -E "error|warning: \[|FAILED|BUILD|e: " | head -120
      - name: API check
        run: |
          gradle :app:testMusicReleaseUnitTest --tests com.lttube.tv.MusicApiTest --no-daemon 2>&1 | grep -E "MUS|FAILED|error:|BUILD" | head -400
